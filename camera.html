<!doctype html>
<html lang="ar"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.ib{width:48px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:12px;color:#F9FAFB;cursor:pointer}
.ib:active{background:rgba(249,250,251,.1)}
.pr{cursor:pointer;position:relative}
.pr:active:after{content:'';position:absolute;inset:0;border-radius:inherit;background:currentColor;opacity:.1}
svg.i{width:24px;height:24px;display:block}
#v{width:100%;height:100%;object-fit:cover;display:block}
@keyframes sp{to{transform:rotate(360deg)}}
@keyframes fl{from{opacity:.9}to{opacity:0}}
</style></head><body>
<div id="root" style="position:fixed;inset:0;background:#000;overflow:hidden">
<div id="pv" style="position:absolute;left:0;right:0;overflow:hidden;background:#1F2937"><video id="v" autoplay playsinline muted></video></div>
<div id="ui"></div></div>
<script src="icons.js"></script><script src="common.js"></script>
<script>
const SCREEN='camera';
const block=`<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="8.25"/><path d="M6.2 17.8 17.8 6.2"/></svg>`;
const T={ar:{auto:'تلقائي',on:'تشغيل',off:'إيقاف',torch:'مصباح',pt:'يحتاج التطبيق إلى الكاميرا لتصوير المستندات',pl:'تُحفظ صورك على هاتفك فقط.',pb:'السماح بالكاميرا',dt:'إذن الكاميرا غير مفعّل',dl:'يمكنك تفعيله من إعدادات التطبيق.',db:'فتح الإعدادات',ft:'الكاميرا غير متاحة حاليًا',fl:'ربما يستخدمها تطبيق آخر. أغلقه ثم أعد المحاولة.',fb:'إعادة المحاولة',
lm:n=>`وصلت الجلسة إلى الحد الأقصى (${n} صفحة)`,lb:'عرض الصفحات',um:'تمت إزالة الصورة',ub:'تراجع',dm:'تم حذف الجلسة',cf:'تعذّر التقاط الصورة. حاول مرة أخرى.',bi:'تعذّر فتح الصورة. ربما تكون تالفة.',pp:'الملف محمي بكلمة مرور ولا يمكن فتحه.',pd:'تعذّر فتح الملف. ربما يكون تالفًا.',
pl2:(x,r)=>`لا يمكن إضافة ${x} صفحة. يتبقى في الجلسة مكان لـ${r} صفحة فقط.`,padd:(x,t)=>`جارٍ إضافة الصفحات… ${x} من ${t}`,cancel:'إلغاء',rt:n=>`إعادة تصوير الصفحة ${n}`,
xT:'الخروج وحذف الجلسة؟',xB:n=>`سيتم حذف ${arN(n)} نهائيًا. صدّرها أولًا إن كنت تحتاجها.`,xV:'عرض الصفحات',xD:'خروج وحذف',
aX:'خروج',aXr:'إلغاء إعادة التصوير',aS:'الإعدادات',aC:'التقاط صورة',aG:'إضافة صورة من الهاتف',aP:'إضافة ملف PDF',aPg:n=>`الصفحات: ${n}`,aF:m=>`الفلاش: ${m}`},
en:{auto:'Auto',on:'On',off:'Off',torch:'Torch',pt:'Camera access is needed to scan documents',pl:'Your photos stay on your phone.',pb:'Allow camera',dt:'Camera access is turned off',dl:'You can turn it on in app settings.',db:'Open settings',ft:'Camera unavailable',fl:'Another app may be using it. Close it, then try again.',fb:'Try again',
lm:n=>`Session limit reached (${n} pages)`,lb:'View pages',um:'Photo removed',ub:'Undo',dm:'Session deleted',cf:"Couldn't take the photo. Try again.",bi:"Couldn't open this image. It may be damaged.",pp:"This file is password-protected and can't be opened.",pd:"Couldn't open this file. It may be damaged.",
pl2:(x,r)=>`Can't add ${x} pages. Only ${r} more pages fit in this session.`,padd:(x,t)=>`Adding pages… ${x} of ${t}`,cancel:'Cancel',rt:n=>`Retaking page ${n}`,
xT:'Exit and delete session?',xB:n=>`${n} ${n==1?'page':'pages'} will be permanently deleted. Export them first if you need them.`,xV:'View pages',xD:'Exit and delete',
aX:'Exit',aXr:'Cancel retake',aS:'Settings',aC:'Take photo',aG:'Add photo from phone',aP:'Add PDF file',aPg:n=>`Pages: ${n}`,aF:m=>`Flash: ${m}`}};
// st: open (تفتح) / normal / perm (أ) / denied (ب) / fail
let P={st:'open',bar:false,mode:'main',rt:null,snack:null,dlg:false,busy:false,pdf:null},stream=null,snT=null;
const v=document.getElementById('v');
async function startCam(ask){if(stream)return;P.st=P.st=='normal'?'normal':'open';
if(!ask){try{const q=await navigator.permissions.query({name:'camera'});if(q.state=='prompt'){P.st='perm';return draw();}if(q.state=='denied'){P.st='denied';return draw();}}catch(e){}}
try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1920},height:{ideal:1440}},audio:false});
if(APP.cur!='camera'){stopCam();return;}v.srcObject=stream;P.st='normal';torch();}
catch(e){P.st=e.name=='NotAllowedError'||e.name=='SecurityError'?(P.st=='perm'||P.st=='denied'?'denied':'perm'):'fail';}draw();}
function stopCam(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}v.srcObject=null;}
function torch(){if(!stream)return;const tr=stream.getVideoTracks()[0];try{tr.applyConstraints({advanced:[{torch:APP.flash=='ic_flash_torch'}]}).catch(()=>{});}catch(e){}}
function setFlash(m){APP.flash=m;P.bar=false;torch();draw();}
function snack(k,arg){P.snack={k,arg};clearTimeout(snT);snT=setTimeout(()=>{P.snack=null;draw();},(k=='um'||k=='dm')?10000:4000);draw();}
function snackAct(){const k=P.snack&&P.snack.k;P.snack=null;clearTimeout(snT);if(k=='um')go('processing',{mode:'resume'});else if(k=='dm')APP.undoNewDoc();else if(k=='lm')go('pages');else draw();}
const full=()=>P.mode=='main'&&APP.pages.length>=APP.MAX;
// صوت الالتقاط: نقرتين قصيرتين ناعمتين، تقريب لصوت كاميرا أندرويد
let AC=null;
function click(){if(!APP.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const t0=AC.currentTime+.01;
[[0,2600,.5],[.075,1700,.35]].forEach(([dt,f,v])=>{const n=Math.round(AC.sampleRate*.03),b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=Math.random()*2-1;
const s=AC.createBufferSource(),bp=AC.createBiquadFilter(),g=AC.createGain();s.buffer=b;bp.type='bandpass';bp.frequency.value=f;bp.Q.value=1.2;
g.gain.setValueAtTime(v,t0+dt);g.gain.exponentialRampToValueAtTime(.001,t0+dt+.03);s.connect(bp).connect(g).connect(AC.destination);s.start(t0+dt);});}catch(e){}}
function shoot(){if(P.busy)return;if(full())return snack('lm');if(P.st=='perm'||P.st=='denied')return startCam(true);if(P.st!='normal')return;
const vw=v.videoWidth,vh=v.videoHeight;if(!vw)return snack('cf');P.busy=true;P.bar=false;
const box=document.getElementById('pv').getBoundingClientRect(),k=Math.max(box.width/vw,box.height/vh),cw=box.width/k,ch=box.height/k,sx=(vw-cw)/2,sy=(vh-ch)/2,m=Math.min(1,1600/Math.max(cw,ch));
const cv=document.createElement('canvas');cv.width=Math.round(cw*m);cv.height=Math.round(ch*m);cv.getContext('2d').drawImage(v,sx,sy,cw,ch,0,0,cv.width,cv.height);
const fx=document.createElement('div');fx.style.cssText='position:fixed;inset:0;background:#fff;z-index:50;animation:fl .25s forwards;pointer-events:none';document.body.appendChild(fx);setTimeout(()=>fx.remove(),260);click();
const ph={src:cv.toDataURL('image/jpeg',.88),w:cv.width,h:cv.height};setTimeout(()=>{P.busy=false;toProc(ph);},180);}
function toProc(ph){if(P.mode=='retake')go('processing',{mode:'retake',pageId:P.rt.id,photo:ph});else go('processing',{mode:'new',photo:ph});}
function gallery(){if(full())return snack('lm');pick('image/*',f=>APP.fileToPhoto(f).then(toProc,()=>snack('bi')));}
function pdf(){if(full())return snack('lm');pick('application/pdf,.pdf',async f=>{P.pdf={x:0,t:0};draw();
try{const r=await APP.addPdf(f,(x,t)=>{if(P.pdf){P.pdf={x,t};draw();}},()=>!P.pdf);if(!P.pdf)return;P.pdf=null;
if(r.err=='limit'){draw();return snack('pl2',[r.x,r.r]);}if(r.n)go('pages',{end:1});else draw();}
catch(e){const was=P.pdf;P.pdf=null;draw();if(was)snack(e&&e.name=='PasswordException'?'pp':'pd');}});}
function xTap(){if(P.mode=='retake'){const o=P.rt.from;return o=='edit'?go('processing',{mode:'resume'}):go('pages');}
if(!APP.pages.length)return APP.exitApp();P.dlg=true;P.bar=false;draw();}
function dlgEnd(k){P.dlg=false;if(k=='v')return go('pages');if(k=='d'){APP.endSession();return APP.exitApp();}draw();}
function onBack(){if(P.pdf){P.pdf=null;return draw();}if(P.dlg){P.dlg=false;return draw();}if(P.bar){P.bar=false;return draw();}xTap();}
function onShow(a){P.mode=a.mode=='retake'?'retake':'main';P.rt=a.mode=='retake'?{id:a.pageId,from:a.from}:P.mode=='main'?null:P.rt;P.dlg=false;P.bar=false;P.busy=false;
if(a.snack)snack(a.snack);else if(P.snack&&P.snack.k=='um')P.snack=null;draw();startCam();}
function onHide(){stopCam();P.bar=false;if(P.snack&&P.snack.k!='lm'){}}
function sn(msg,act){return `<div style="background:#F9FAFB;border-radius:8px;min-height:48px;display:flex;align-items:center;gap:8px;padding-inline:16px 8px"><span style="flex:1;font-size:14px;line-height:20px;color:#171A1A;padding:14px 0">${msg}</span>${act?`<span onclick="snackAct()" class="pr" style="color:#0F6B6D;font-weight:500;font-size:14px;min-height:48px;display:flex;align-items:center;padding:0 8px;white-space:nowrap;border-radius:8px">${act}</span>`:''}</div>`;}
function draw(){const t=T[S.lang],W=VW(),H=VH(),ar=S.lang=='ar',rt=P.mode=='retake',font=ar?"'IBM Plex Sans Arabic'":"Inter",acc='#7DD3D3',dis=full();
const top=56,pv=Math.min(Math.round(W*4/3),H-top-96),bot=H-top-pv,bh=Math.max(bot,120);
const pvEl=document.getElementById('pv');pvEl.style.top=top+'px';pvEl.style.height=pv+'px';v.style.visibility=P.st=='normal'?'visible':'hidden';
document.getElementById('root').dir=ar?'rtl':'ltr';document.getElementById('root').style.fontFamily=font+',system-ui';
let view='';
if(P.st=='perm'||P.st=='denied'||P.st=='fail'){const a=P.st=='perm',d=P.st=='denied';view=`<div style="position:absolute;top:${top}px;height:${pv}px;left:0;right:0;background:#1F2937;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;text-align:center;gap:8px"><div style="font-size:20px;line-height:28px;font-weight:600;color:#F9FAFB">${a?t.pt:d?t.dt:t.ft}</div><div style="font-size:14px;line-height:20px;color:#9CA3AF">${a?t.pl:d?t.dl:t.fl}</div><div onclick="${P.st=='fail'?'stopCam();startCam(true)':'startCam(true)'}" class="pr" style="margin-top:16px;background:${acc};color:#003738;border-radius:12px;min-height:48px;padding:0 24px;display:flex;align-items:center;font-size:14px;font-weight:500">${a?t.pb:d?t.db:t.fb}</div></div>`;}
const modes=[['ic_flash_auto',t.auto],['ic_flash_on',t.on],['ic_flash_off',t.off],['ic_flash_torch',t.torch]],cur=modes.find(m=>m[0]==APP.flash)[1];
const fl=P.bar?`<div style="position:absolute;top:${top+4}px;inset-inline:16px;background:rgba(0,0,0,.7);border-radius:12px;display:flex;justify-content:space-around;padding:8px 4px;z-index:3">${modes.map(m=>{const on=APP.flash==m[0];return `<div onclick="setFlash('${m[0]}')" style="cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;color:${on?acc:'#F9FAFB'};min-width:64px;min-height:48px;justify-content:center;padding:6px 4px;border-radius:8px;${on?'background:rgba(125,211,211,.12)':''}">${ic(m[0])}<div style="font-size:12px;line-height:16px">${m[1]}</div></div>`}).join('')}</div>`:'';
const s=P.snack,msg=s?(s.k=='lm'?t.lm(APP.MAX):s.k=='pl2'?t.pl2(...s.arg):t[s.k]):'',act=s?{um:t.ub,dm:t.ub,lm:t.lb}[s.k]:'';
const snk=s?`<div style="position:absolute;bottom:${bh+12}px;inset-inline:16px;z-index:4">${sn(msg,act)}</div>`:'';
const op=dis?'opacity:.38;':'',busy=P.busy;
const n=APP.pages.length,rtN=rt?APP.pages.findIndex(p=>p.id==P.rt.id)+1:0;
const db=(label,fn,col)=>`<div onclick="${fn}" class="pr" style="min-height:48px;display:flex;align-items:center;padding:4px 12px;box-sizing:border-box;border-radius:12px;font-size:14px;line-height:20px;font-weight:500;color:${col};text-align:start">${label}</div>`;
const c=C(),dlg=P.dlg?`<div style="position:absolute;inset:0;background:rgba(0,0,0,.32);z-index:20;display:flex;align-items:center;justify-content:center;padding:24px" onclick="if(event.target===this)dlgEnd()"><div style="background:${c.dlg};border-radius:28px;padding:24px 24px 16px;width:100%;max-width:312px;box-sizing:border-box;max-height:100%;overflow:auto"><div style="font-size:24px;line-height:32px;color:${c.tx};margin-bottom:16px">${t.xT}</div><div style="font-size:14px;line-height:20px;color:${c.t2};margin-bottom:24px">${t.xB(n)}</div><div style="display:flex;flex-direction:column;align-items:flex-start;margin-inline-start:-12px">${db(t.xD,"dlgEnd('d')",c.err)}${db(t.xV,"dlgEnd('v')",c.pri)}${db(t.cancel,'dlgEnd()',c.pri)}</div></div></div>`:'';
const pd=P.pdf?`<div style="position:absolute;inset:0;background:rgba(0,0,0,.32);z-index:20;display:flex;align-items:center;justify-content:center;padding:24px"><div style="background:${c.dlg};border-radius:28px;padding:24px 24px 16px;width:100%;max-width:312px;box-sizing:border-box"><div style="font-size:16px;line-height:24px;color:${c.tx};margin-bottom:16px">${t.padd(P.pdf.x,P.pdf.t||'…')}</div><div style="height:4px;border-radius:2px;background:${c.sec};overflow:hidden"><div style="height:100%;width:${P.pdf.t?P.pdf.x/P.pdf.t*100:0}%;background:${c.pri};transition:width 300ms"></div></div><div style="display:flex;justify-content:flex-end;margin-top:16px;margin-inline-end:-12px">${db(t.cancel,'P.pdf=null;draw()',c.pri)}</div></div></div>`:'';
document.getElementById('ui').innerHTML=`
<div style="position:absolute;top:0;left:0;right:0;height:${top}px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 8px;gap:4px;z-index:2;color:#F9FAFB"><div style="justify-self:start"><div class="ib" onclick="xTap()" aria-label="${rt?t.aXr:t.aX}">${ic('ic_close')}</div></div><div style="text-align:center;font-size:14px;line-height:20px;font-weight:500;white-space:nowrap" aria-live="polite">${rt?t.rt(rtN):''}</div><div style="justify-self:end;display:flex;gap:4px"><div class="ib" onclick="P.bar=!P.bar;draw()" aria-label="${t.aF(cur)}">${ic(APP.flash)}</div>${rt?'':`<div class="ib" onclick="go('settings')" aria-label="${t.aS}">${ic('ic_settings')}</div>`}</div></div>
${fl}${view}${snk}
<div style="position:absolute;bottom:0;left:0;right:0;height:${bh}px;background:${bot<120?'rgba(0,0,0,.7)':'#000'};display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 16px">
<div style="justify-self:start">${rt?'':`<div onclick="go('pages')" class="pr" aria-label="${t.aPg(n)}" style="display:flex;align-items:center;gap:6px;min-height:48px;padding:0 12px;border-radius:12px;background:#1F2937;color:#F9FAFB">${ic('ic_pages')}<span style="font:500 14px/20px Inter,system-ui">${n}</span></div>`}</div>
<div onclick="shoot()" aria-label="${t.aC}" style="cursor:pointer;width:76px;height:76px;border-radius:50%;border:4px solid ${acc};box-sizing:border-box;display:flex;align-items:center;justify-content:center;${op}${P.st=='open'||P.st=='fail'?'opacity:.38;':''}"><div style="width:60px;height:60px;border-radius:50%;background:#F9FAFB;display:flex;align-items:center;justify-content:center;color:#111827;${busy?'transform:scale(.9)':''}">${dis||P.st=='open'||P.st=='fail'?block:busy?`<div style="width:28px;height:28px;border-radius:50%;border:3px solid #D1D5DB;border-top-color:#0F6B6D;animation:sp 1s linear infinite"></div>`:''}</div></div>
<div style="justify-self:end;display:flex;gap:4px;${op}">${rt?'':`<div class="ib" onclick="pdf()" aria-label="${t.aP}">${dis?block:ic('ic_add_pdf')}</div>`}<div class="ib" onclick="gallery()" aria-label="${t.aG}">${dis?block:ic('ic_add_photo')}</div></div></div>${dlg}${pd}`;}
</script></body></html>
