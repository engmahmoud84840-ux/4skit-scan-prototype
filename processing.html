<style>

</style></head><body><div id="ph"></div>

<script>

Object.assign(pg,{f:P.f,br:P.br,rot:P.rot,c:cp(P.c)});APP.makeImg(pg);go('pages',a);}

function xTap(){if(P.bar)return;P.mode=='new'?discard():cancelEdit();}
function onBack(){if(P.bar=='crop')return cropCancel();if(P.bar=='bright')return brCancel();P.mode=='new'?discard():cancelEdit();}
function fitDoc(d){const a=document.getElementById('area').getBoundingClientRect(),aw=a.width-32,ah=a.height-32,r=d.naturalHeight&&d.naturalWidth?d.naturalHeight/d.naturalWidth:1.414;const w=Math.min(aw,ah/r);d.style.width=w+'px';d.style.height=w*r+'px';d.style.visibility='visible';}
function draw(){if(!P.ph)return;const t=T[S.lang],fz=1,W=VW(),H=VH(),ar=S.lang=='ar',c=C();
document.documentElement.style.setProperty('--pri',c.pri);

const btn=(label,fn,kind,off,icn)=>{const bg=off?'transparent':kind=='p'?c.pri:c.sec,col=off?c.tx:kind=='p'?c.on:c.pri;return `<div ${off?'':`onclick="${fn}"`} class="${off?'':'pr'}" style="flex:1;min-height:48px;display:flex;align-items:center;justify-content:center;text-align:center;padding:4px 16px;box-sizing:border-box;border-radius:12px;background:${bg};color:${col};font-size:14px;line-height:20px;gap:8px;font-weight:500;${off?`border:1px solid ${c.tx};opacity:.38;`:''}">${icn&&icn!='ic_arrow_forward'?(off?ic('ic_block'):ic(icn)):''}<span>${label}</span>${icn=='ic_arrow_forward'?(off?ic('ic_block'):`<span style="display:flex;${ar?'transform:scaleX(-1)':''}">${ic(icn)}</span>`):''}</div>`;};
const fl=['auto','color','gray','bw','orig'].map(k=>{const on=P.f==k,lab=k=='auto'&&on?`${t.f.auto} · ${t.f.color}`:t.f[k];return `<div ${dis?'':`onclick="setF('${k}')"`} class="${dis?'':'pr'}" style="flex:none;display:flex;align-items:center;gap:6px;min-height:32px;padding:4px ${on?10:12}px;box-sizing:border-box;border-radius:8px;white-space:nowrap;font-size:14px;line-height:20px;font-weight:500;${on?`border:2px solid ${c.pri};background:${c.sec};color:${c.pri};`:`border:1px ${dis?'dashed':'solid'} ${c.bd};color:${c.tx};`}${dis?'opacity:.38;':''}">${on?`<span style="width:18px;height:18px;display:flex">${ic('ic_check',18)}</span>`:''}${lab}</div>`;}).join('');
let mid;

else mid=`<div style="display:flex;padding:4px 8px">${tool('ic_retake',t.rt,'retake()')}${tool('ic_crop',t.crop,'openCrop()')}${tool('ic_rotate',t.rot,'rot()')}${tool('ic_brightness',t.br,'openBr()')}${tool('ic_reauto',t.ra,'reauto()',!edited())}</div>`;
const acts=edit?[btn(t.cancel,'cancelEdit()','s',lock),btn(t.save,'save()','p',dis)]:[btn(t.sas,'sas()','s',dis||P.lim,'ic_scan_new'),btn(t.next,'next()','p',dis,'ic_arrow_forward')];
if(P.lim&&!dis&&!edit)acts[0]=acts[0].replace('<div ','<div onclick="sas()" ');
const mk=k=>P.snack=='undo'?snack(t.ra2,t.undo,c,'undo()',k):P.snack=='limit'?snack(t.lm,'',c):'',sn=mk(0);
const xoff=lock;
document.getElementById('ph').innerHTML=`<div dir="${ar?'rtl':'ltr'}" style="width:${W}px;height:${H}px;overflow:hidden;position:relative;font-family:${font},system-ui;background:${c.bg};display:flex;flex-direction:column">
${(()=>{const mc=document.createElement('canvas').getContext('2d'),mw=(x,w,px)=>{mc.font=`${w} ${px}px ${font}`;return mc.measureText(x).width};
const xB=`<div onclick="xTap()" aria-label="${t.aX}" style="${xoff?'opacity:.38':''}" class="ib ${xoff?'':'pr'}">${xoff?ic('ic_block'):ic('ic_close')}</div>`;
const tB=`<div style="font-weight:600;font-size:20px;line-height:28px;white-space:nowrap">${t.page} ${P.N}</div>`;
const eB=edit?'':`<div ${dis?'':'onclick="qexp()"'} class="${dis?'':'pr'}" style="display:flex;align-items:center;gap:6px;min-height:40px;padding:0 12px 0 10px;border-radius:12px;font-size:14px;line-height:20px;font-weight:500;white-space:nowrap;flex:none;${dis?`border:1px solid ${c.tx};opacity:.38;color:${c.tx}`:`background:${c.sec};color:${c.pri}`}">${dis?ic('ic_block'):ic('ic_export')}${t.exp}</div>`;
const side=Math.max(48,edit?0:mw(t.exp,500,14)+20+6+22),fit=mw(`${t.page} ${P.N}`,600,20)+2*side+8<=W;
return fit?`<div style="min-height:64px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 4px;background:${c.bar};border-bottom:1px solid ${c.bd};flex:none;color:${c.tx}"><div style="justify-self:start">${xB}</div>${tB}<div style="justify-self:end">${eB}</div></div>`
:`<div style="background:${c.bar};border-bottom:1px solid ${c.bd};flex:none;padding:0 4px 8px;color:${c.tx}"><div style="display:flex;justify-content:space-between;align-items:center;min-height:64px">${xB}${eB}</div><div style="padding:0 12px;display:flex;justify-content:center">${tB}</div></div>`;})()}
<div id="area" style="flex:1;position:relative;overflow:hidden;min-height:0">${sn?`<div id="snw" style="position:absolute;bottom:12px;inset-inline:16px;z-index:5">${sn}</div>`:''}</div>
<div style="background:${c.bar};border-top:1px solid ${c.bd};flex:none">
<div class="chips">${fl}</div>
${mid}
<div style="display:flex;gap:8px;padding:8px 16px 16px;border-top:1px solid ${c.bd}">${acts.join('')}</div>
</div></div>`;
fill();const m=document.getElementById('snm');if(m&&m.nextElementSibling&&m.offsetHeight>2*20+28+1)document.getElementById('snw').innerHTML=mk(1);if(P.snack!==snK){clearTimeout(snT);snK=P.snack;if(P.snack)snT=setTimeout(()=>{P.snack=null;snK=null;draw();},P.snack=='limit'?4000:10000);}}
function photo(){return `<img src="${P.ph.src}" style="position:absolute;inset:0;width:100%;height:100%;display:block" draggable="false">`;}
function fill(){const A=document.getElementById('area'),a=A.getBoundingClientRect(),aw=a.width-32,ah=a.height-32;const keep=A.innerHTML;let h='';
if(P.bar=='crop'){const r=P.ph.w/P.ph.h,pw=Math.min(aw,ah*r),ph=pw/r,x0=(a.width-pw)/2,y0=(a.height-ph)/2,pr=C().pri;
h=`<div style="position:absolute;left:${x0}px;top:${y0}px;width:${pw}px;height:${ph}px">${photo()}</div>`;
h+=`<svg id="cs" style="position:absolute;left:${x0}px;top:${y0}px;overflow:visible;touch-action:none" width="${pw}" height="${ph}"><polygon id="cp" fill="${pr}" fill-opacity=".12" stroke="${pr}" stroke-width="2"/>${[0,1,2,3].map(i=>`<g data-m="${i}" style="cursor:grab"><circle r="24" fill="transparent"/><rect x="-14" y="-4.5" width="28" height="9" rx="4.5" fill="#fff" stroke="${pr}" stroke-width="2.5"/></g>`).join('')}${[0,1,2,3].map(i=>`<g data-i="${i}" style="cursor:grab"><circle r="24" fill="transparent"/><circle r="10" fill="#fff" stroke="${pr}" stroke-width="3"/></g>`).join('')}</svg><div id="mag" style="display:none;position:absolute;width:96px;height:96px;border-radius:50%;overflow:hidden;border:2px solid ${pr};background:#3a3f47;z-index:6;pointer-events:none"><div id="mi" style="position:absolute;left:0;top:0;width:${pw}px;height:${ph}px;transform-origin:0 0">${photo()}<svg style="position:absolute;inset:0;overflow:visible" width="${pw}" height="${ph}"><polygon id="mp" fill="none" stroke="${pr}" stroke-width="1.5"/></svg></div><div style="position:absolute;left:47px;top:36px;width:2px;height:24px;background:${pr}"></div><div style="position:absolute;top:47px;left:36px;height:2px;width:24px;background:${pr}"></div></div>`;

A.innerHTML=h+keep;const d=document.getElementById('doc');if(d&&d.complete&&d.naturalWidth)fitDoc(d);}
function crop(x0,y0,pw,ph){const sv=document.getElementById('cs'),poly=document.getElementById('cp'),mp=document.getElementById('mp'),g=[...sv.querySelectorAll('g[data-i]')],gm=[...sv.querySelectorAll('g[data-m]')],mag=document.getElementById('mag'),mi=document.getElementById('mi'),A=document.getElementById('area');
const cl=v=>Math.max(0,Math.min(1,v));
const upd=()=>{const pts=P.c.map(p=>`${p[0]*pw},${p[1]*ph}`).join(' ');poly.setAttribute('points',pts);mp.setAttribute('points',pts);g.forEach((e,i)=>e.setAttribute('transform',`translate(${P.c[i][0]*pw},${P.c[i][1]*ph})`));
gm.forEach((e,i)=>{const a=P.c[i],b=P.c[(i+1)%4],mx=(a[0]+b[0])/2*pw,my=(a[1]+b[1])/2*ph,ang=Math.atan2((b[1]-a[1])*ph,(b[0]-a[0])*pw)*180/Math.PI;e.setAttribute('transform',`translate(${mx},${my}) rotate(${ang})`);});};upd();
const lens=(p,fy)=>{const x=p[0],y=p[1],px=x0+x*pw,aw=A.clientWidth,ah=A.clientHeight,L=px<aw/2?aw-108:8,T=fy<ah*.4?ah-108:8;mag.style.left=L+'px';mag.style.top=T+'px';mi.style.transform=`translate(${48-x*pw*2}px,${48-y*ph*2}px) scale(2)`;};
const drag=(e,ev,start,move)=>{ev.preventDefault();e.setPointerCapture(ev.pointerId);const ar=A.getBoundingClientRect(),s=start(ev);
const mv=m=>{move(s,m);upd();lens(s.pt(),m.clientY-ar.top);};mag.style.display='block';lens(s.pt(),ev.clientY-ar.top);
const up=()=>{mag.style.display='none';e.removeEventListener('pointermove',mv);e.removeEventListener('pointerup',up);e.removeEventListener('pointercancel',up);};e.addEventListener('pointermove',mv);e.addEventListener('pointerup',up);e.addEventListener('pointercancel',up);};
g.forEach(e=>e.addEventListener('pointerdown',ev=>{const i=+e.dataset.i;drag(e,ev,v=>{const r=sv.getBoundingClientRect();return{dx:P.c[i][0]*pw-(v.clientX-r.left),dy:P.c[i][1]*ph-(v.clientY-r.top),pt:()=>P.c[i]};},(s,m)=>{const r=sv.getBoundingClientRect();P.c[i]=[cl((m.clientX-r.left+s.dx)/pw),cl((m.clientY-r.top+s.dy)/ph)];});}));
gm.forEach(e=>e.addEventListener('pointerdown',ev=>{const i=+e.dataset.m,j=(i+1)%4;drag(e,ev,v=>{const a=P.c[i].slice(),b=P.c[j].slice(),ex=(b[0]-a[0])*pw,ey=(b[1]-a[1])*ph,l=Math.hypot(ex,ey)||1;return{a,b,nx:-ey/l,ny:ex/l,sx:v.clientX,sy:v.clientY,pt:()=>[(P.c[i][0]+P.c[j][0])/2,(P.c[i][1]+P.c[j][1])/2]};},(s,m)=>{const d=(m.clientX-s.sx)*s.nx+(m.clientY-s.sy)*s.ny,ox=s.nx*d/pw,oy=s.ny*d/ph;P.c[i]=[cl(s.a[0]+ox),cl(s.a[1]+oy)];P.c[j]=[cl(s.b[0]+ox),cl(s.b[1]+oy)];});}));}
</script></body></html>
